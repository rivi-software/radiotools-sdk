scalar JSON

  """
  Every field but station is nullable: one that fails answers null with its error, and the
  fields beside it keep their data.
  """
  type Query {
    station: Station!
    schemas(type: String, version: Int): [ContentSchema!]
    """
    Published records of one type, newest first by default. publishedAt orders by first
    publication, updatedAt by the live version's publication; pass nextCursor to continue.
    """
    content(
      type: String!
      cursor: ID
      limit: Int = 25
      sort: ContentSort = publishedAt
      direction: SortDirection = desc
      filter: [ContentFilter!]
    ): ContentCollection
    contentRecord(id: ID!): PublishedRecord
    """
    The record a slug names; a slug it used before resolves to the record as it is now.
    """
    contentBySlug(type: String!, slug: String!): PublishedRecord
    """
    The broadcasts in the window on the main channel, or on the channel that channel names.
    """
    schedule(
      fromDate: String!
      throughDate: String!
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): Schedule
    """
    The shows on air in the window, with their regular slots, on the main channel or the one
    channel names.
    """
    shows(
      fromDate: String!
      throughDate: String!
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): Shows
    """
    The broadcast on air now on the main channel, or on the one channel names.
    """
    currentBroadcast(
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): CurrentBroadcast
    """
    Published recordings of aired broadcasts, newest first; programId keeps one show's and
    channel one channel's.
    """
    onDemand(
      programId: ID
      cursor: String
      limit: Int = 25
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): OnDemand
    """
    What plays now on the main channel, or on the one channel names.
    """
    nowPlaying(
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): NowPlaying
    """
    The tracks that played, newest first, on the main channel or the one channel names.
    """
    trackHistory(
      cursor: String
      limit: Int = 25
      "The slug of a channel in station.channels, or main; the main channel without it."
      channel: String
    ): TrackHistory
    weather: Weather
    traffic: Traffic
  }

  type Mutation {
    previewEditorial(input: PreviewInput!): RevisionPreview!
  }

  type Station {
    contractVersion: Int!
    id: ID!
    slug: String!
    name: String!
    timezone: String!
    publishingLanguage: String!
    """
    Present once the station has saved a profile.
    """
    profile: StationProfile
    """
    The channels listeners see: the main channel first, then every other published channel.
    Pass a channel's slug as channel to schedule, shows, currentBroadcast, onDemand,
    nowPlaying and trackHistory; a channel that is unknown, archived or not published answers
    null with a NOT_FOUND error.
    """
    channels: [StationChannel!]!
    resources: StationResources!
    delivery: StationDelivery!
  }

  """
  A channel listeners see. The main channel is the station itself: its id is the station's id,
  its slug main, and its stream and frequency label the profile's.
  """
  type StationChannel {
    id: ID!
    slug: String!
    name: String!
    main: Boolean!
    """
    How listeners tune in, for example "DAB+ 11C".
    """
    frequencyLabel: String
    streamUrl: String
    "Its local editions listeners see, oldest first."
    editions: [StationLocalEdition!]!
  }

  """
  A local edition: a window of its channel's schedule that one area hears in place of the
  regular broadcast.
  """
  type StationLocalEdition {
    id: ID!
    slug: String!
    name: String!
    "The area it serves, for example its municipalities."
    area: String!
    "Its own stream; null plays its channel's."
    streamUrl: String
  }

  type StationProfile {
    tagline: String
    description: String
    """
    How listeners tune in, for example "FM 105.3 · DAB+ 8A".
    """
    frequencyLabel: String
    websiteUrl: String
    streamUrl: String
    contactEmail: String
    phone: String
    address: StationAddress
    social: [StationSocialLink!]!
  }

  type StationAddress {
    street: String
    postalCode: String
    city: String
    country: String
  }

  type StationSocialLink {
    network: String!
    url: String!
  }

  type StationResources {
    schemas: String!
    content: String
    schedule: String
    shows: String
    programs: String
      @deprecated(reason: "Always null: the programs alias of shows is removed. Use shows.")
    broadcast: String
    nowPlaying: String
    trackHistory: String
    """
    Published recordings of aired broadcasts; null with the schedule or the media module off.
    """
    onDemand: String
    """
    The WebSocket carrying the station's public feed rows; null while offline or switched off.
    """
    realtime: StationRealtime
    weather: String
    traffic: String
    media: String!
  }

  type StationRealtime {
    url: String!
    channel: String!
  }

  type StationDelivery {
    """
    Always no-store, which older clients require; it is not the cache policy. GraphQL answers
    are no-store, and each REST response's Cache-Control header is its own policy.
    """
    cache: String! @deprecated(reason: "Always no-store. Read each response's Cache-Control.")
    conditional: String!
    pollIntervalSeconds: Int!
  }

  type ContentSchema {
    key: String!
    label: String!
    version: Int!
    archived: Boolean!
    fields: JSON!
  }

  enum ContentSort {
    publishedAt
    updatedAt
  }

  enum SortDirection {
    asc
    desc
  }

  enum ContentFilterOp {
    eq
    contains
    anyOf
  }

  """
  eq and contains take value; anyOf takes values. Text and choice delivery fields only.
  """
  input ContentFilter {
    field: String!
    op: ContentFilterOp = eq
    value: String
    values: [String!]
  }

  type ContentCollection {
    records: [PublishedRecord!]!
    nextCursor: ID
  }

  type PublishedRecord {
    contractVersion: Int!
    id: ID!
    publicationId: ID!
    revision: Int!
    type: String!
    schemaVersion: Int!
    publishedAt: String!
    firstPublishedAt: String!
    values: JSON!
    """
    The values of a news, presenters, shows or pages record, typed; null for a catalog or
    custom type, whose values are only in values.
    """
    typedValues: DefaultTypeValues
    document: JSON!
    media: [PublicMedia!]!
    """
    Planning shows a published shows/presenters profile belongs to; null for other types.
    """
    related: PublishedRelated
  }

  """
  The fields every station's news, presenters, shows and pages share. title and slug are always
  set; any other field is null until the record sets it.
  """
  union DefaultTypeValues = NewsValues | PresenterValues | ShowValues | PageValues

  type NewsValues {
    title: String!
    slug: String!
    "A media asset id: the media entry with this assetId."
    featured_image: ID
    summary: String
    "A choice key; the station manages the options and their labels (schemas)."
    category: String
    source: String
  }

  type PresenterValues {
    "The presenter's name."
    title: String!
    slug: String!
    featured_image: ID
    "Rich text."
    bio: JSON
    role: String
  }

  type ShowValues {
    title: String!
    slug: String!
    featured_image: ID
    "Rich text."
    description: JSON
    presenters: [ShowPresenter!]
    website: String
  }

  type ShowPresenter {
    "The id of a published presenters record."
    presenter: ID
  }

  type PageValues {
    title: String!
    slug: String!
    featured_image: ID
    "Also the page's meta description."
    summary: String
  }

  type PublishedRelated {
    programIds: [ID!]!
  }

  type PublicMedia {
    assetId: ID!
    versionId: ID!
    kind: String!
    url: String!
    credits: String!
    mime: String!
    alt: String!
    width: Int
    height: Int
    duration: Float
    variants: PublicMediaVariants!
  }

  type PublicMediaVariants {
    thumb: String
    display: String
    card: String
    square: String
  }

  type Schedule {
    contractVersion: Int!
    timezone: String!
    broadcasts: [Broadcast!]!
    truncated: Boolean!
  }

  type Shows {
    contractVersion: Int!
    timezone: String!
    fromDate: String!
    throughDate: String!
    shows: [ShowSummary!]!
    truncated: Boolean!
  }

  type ShowSummary {
    id: ID!
    title: String!
    profileId: ID
    "live, nonstop or prerecorded"
    type: String!
    presenters: [BroadcastPresenter!]!
    slots: [ShowSlot!]!
  }

  """
  A regular slot: weekday 0 = Sunday … 6 = Saturday, startTime is wall time in timezone.
  """
  type ShowSlot {
    weekday: Int!
    startTime: String!
    durationMinutes: Int!
    "HH:MM in timezone as a schedule shows it: a slot until midnight reads 23:59."
    endTime: String!
    timezone: String!
    intervalWeeks: Int!
    fromDate: String!
    throughDate: String!
    presenters: [BroadcastPresenter!]!
    "The channel the slot is on: the station's id for the main channel."
    channelId: ID!
  }

  type CurrentBroadcast {
    contractVersion: Int!
    timezone: String!
    asOf: String!
    broadcast: Broadcast
  }

  type NowPlaying {
    contractVersion: Int!
    stationId: ID!
    "The channel it plays on: the station's id for the main channel."
    channelId: ID!
    timezone: String!
    track: PlaybackTrack
    elapsedSeconds: Int
    endsAt: String
    freshness: PlaybackFreshness!
  }

  type PlaybackTrack {
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
  }

  type PlaybackFreshness {
    status: String!
    thresholdSeconds: Int!
    ageSeconds: Int
    observedAt: String
    receivedAt: String
  }

  type TrackHistory {
    contractVersion: Int!
    stationId: ID!
    items: [HistoryEntry!]!
    nextCursor: String
  }

  type HistoryEntry {
    id: ID!
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
    "The channel it played on: the station's id for the main channel."
    channelId: ID!
  }

  type Broadcast {
    id: ID!
    title: String!
    startsAt: String!
    endsAt: String!
    "HH:MM in timezone as a schedule shows it: a broadcast until midnight reads 23:59."
    endTime: String!
    timezone: String!
    localDate: String!
    resolution: String!
    status: String!
    cancellationReason: String!
    repeatOfId: ID
    "live, nonstop, prerecorded or repeat"
    nature: String!
    program: BroadcastProgram!
    presenters: [BroadcastPresenter!]!
    "The channel it airs on: the station's id for the main channel."
    channelId: ID!
  }

  type BroadcastProgram {
    id: ID!
    title: String!
    profileId: ID
  }

  type OnDemand {
    contractVersion: Int!
    timezone: String!
    items: [OnDemandBroadcast!]!
    nextCursor: String
  }

  """
  A published recording: the broadcast as the schedule showed it, and its audio.
  """
  type OnDemandBroadcast {
    id: ID!
    title: String!
    description: String!
    startsAt: String!
    endsAt: String!
    "HH:MM in timezone as the schedule showed it: one that ended at midnight reads 23:59."
    endTime: String!
    timezone: String!
    localDate: String!
    "live, nonstop, prerecorded or repeat"
    nature: String!
    program: BroadcastProgram!
    presenters: [BroadcastPresenter!]!
    audio: OnDemandAudio!
    "The channel it aired on: the station's id for the main channel."
    channelId: ID!
  }

  type OnDemandAudio {
    "Anonymous, byte-range capable, same origin as resources.media."
    url: String!
    mime: String!
    size: Int!
    durationSeconds: Float
  }

  type BroadcastPresenter {
    id: ID!
    title: String!
  }

  type Weather {
    stationId: ID!
    timezone: String!
    snapshots: JSON!
  }

  type Traffic {
    stationId: ID!
    snapshot: JSON!
  }

  input PreviewInput {
    stationId: ID!
    recordId: ID!
    revision: Int!
    audience: String!
  }

  type RevisionPreview {
    id: ID!
    revision: Int!
    schemaVersion: Int!
    values: JSON!
    document: JSON!
    media: [PublicMedia!]!
  }
