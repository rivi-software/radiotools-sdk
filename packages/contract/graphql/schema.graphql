scalar JSON

  type Query {
    station: Station!
    schemas(type: String, version: Int): [ContentSchema!]!
    """
    Published records of one type, newest first by default. publishedAt orders by first
    publication, updatedAt by the live version's publication; pass nextCursor to continue.
    """
    content(
      type: String!
      cursor: ID
      limit: Int = 25
      sort: ContentSort = publishedAt
      direction: SortDirection = desc
      filter: [ContentFilter!]
    ): ContentCollection!
    contentRecord(id: ID!): PublishedRecord!
    """
    The record a slug names; a slug it used before resolves to the record as it is now.
    """
    contentBySlug(type: String!, slug: String!): PublishedRecord!
    schedule(fromDate: String!, throughDate: String!): Schedule!
    programs(fromDate: String!, throughDate: String!): Programs!
    currentBroadcast: CurrentBroadcast!
    nowPlaying: NowPlaying!
    trackHistory(cursor: String, limit: Int = 25): TrackHistory!
    weather: Weather
    traffic: Traffic
  }

  type Mutation {
    previewEditorial(input: PreviewInput!): RevisionPreview!
  }

  type Station {
    contractVersion: Int!
    id: ID!
    slug: String!
    name: String!
    timezone: String!
    publishingLanguage: String!
    """
    Present once the station has saved a profile.
    """
    profile: StationProfile
    resources: StationResources!
    delivery: StationDelivery!
  }

  type StationProfile {
    tagline: String
    description: String
    """
    How listeners tune in, for example "FM 105.3 · DAB+ 8A".
    """
    frequencyLabel: String
    websiteUrl: String
    streamUrl: String
    contactEmail: String
    phone: String
    address: StationAddress
    social: [StationSocialLink!]!
  }

  type StationAddress {
    street: String
    postalCode: String
    city: String
    country: String
  }

  type StationSocialLink {
    network: String!
    url: String!
  }

  type StationResources {
    schemas: String!
    content: String
    schedule: String
    programs: String
    broadcast: String
    nowPlaying: String
    trackHistory: String
    """
    The WebSocket carrying the station's public feed rows; null while offline or switched off.
    """
    realtime: StationRealtime
    weather: String
    traffic: String
    media: String!
  }

  type StationRealtime {
    url: String!
    channel: String!
  }

  type StationDelivery {
    cache: String!
    conditional: String!
    pollIntervalSeconds: Int!
  }

  type ContentSchema {
    key: String!
    label: String!
    version: Int!
    archived: Boolean!
    fields: JSON!
  }

  enum ContentSort {
    publishedAt
    updatedAt
  }

  enum SortDirection {
    asc
    desc
  }

  enum ContentFilterOp {
    eq
    contains
    anyOf
  }

  """
  eq and contains take value; anyOf takes values. Text and choice delivery fields only.
  """
  input ContentFilter {
    field: String!
    op: ContentFilterOp = eq
    value: String
    values: [String!]
  }

  type ContentCollection {
    records: [PublishedRecord!]!
    nextCursor: ID
  }

  type PublishedRecord {
    contractVersion: Int!
    id: ID!
    publicationId: ID!
    revision: Int!
    type: String!
    schemaVersion: Int!
    publishedAt: String!
    firstPublishedAt: String!
    values: JSON!
    document: JSON!
    media: [PublicMedia!]!
    """
    Planning programmes a published programs/presenters profile belongs to; null for other types.
    """
    related: PublishedRelated
  }

  type PublishedRelated {
    programIds: [ID!]!
  }

  type PublicMedia {
    assetId: ID!
    versionId: ID!
    kind: String!
    url: String!
    credits: String!
    mime: String!
    alt: String!
    width: Int
    height: Int
    duration: Float
    variants: PublicMediaVariants!
  }

  type PublicMediaVariants {
    thumb: String
    display: String
    card: String
    square: String
  }

  type Schedule {
    contractVersion: Int!
    timezone: String!
    broadcasts: [Broadcast!]!
    truncated: Boolean!
  }

  type Programs {
    contractVersion: Int!
    timezone: String!
    fromDate: String!
    throughDate: String!
    programs: [ProgramSummary!]!
    truncated: Boolean!
  }

  type ProgramSummary {
    id: ID!
    title: String!
    profileId: ID
    presenters: [BroadcastPresenter!]!
    slots: [ProgramSlot!]!
  }

  """
  A regular slot: weekday 0 = Sunday … 6 = Saturday, startTime is wall time in timezone.
  """
  type ProgramSlot {
    weekday: Int!
    startTime: String!
    durationMinutes: Int!
    timezone: String!
    intervalWeeks: Int!
    fromDate: String!
    throughDate: String!
    presenters: [BroadcastPresenter!]!
  }

  type CurrentBroadcast {
    contractVersion: Int!
    timezone: String!
    asOf: String!
    broadcast: Broadcast
  }

  type NowPlaying {
    contractVersion: Int!
    stationId: ID!
    timezone: String!
    track: PlaybackTrack
    elapsedSeconds: Int
    endsAt: String
    freshness: PlaybackFreshness!
  }

  type PlaybackTrack {
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
  }

  type PlaybackFreshness {
    status: String!
    thresholdSeconds: Int!
    ageSeconds: Int
    observedAt: String
    receivedAt: String
  }

  type TrackHistory {
    contractVersion: Int!
    stationId: ID!
    items: [HistoryEntry!]!
    nextCursor: String
  }

  type HistoryEntry {
    id: ID!
    artist: String!
    title: String!
    album: String
    durationSeconds: Int
    artworkUrl: String
    isPlaying: Boolean!
    observedAt: String!
    receivedAt: String!
  }

  type Broadcast {
    id: ID!
    title: String!
    startsAt: String!
    endsAt: String!
    timezone: String!
    localDate: String!
    resolution: String!
    status: String!
    cancellationReason: String!
    repeatOfId: ID
    "live, prerecorded or repeat"
    nature: String!
    program: BroadcastProgram!
    presenters: [BroadcastPresenter!]!
  }

  type BroadcastProgram {
    id: ID!
    title: String!
    profileId: ID
  }

  type BroadcastPresenter {
    id: ID!
    title: String!
  }

  type Weather {
    stationId: ID!
    timezone: String!
    snapshots: JSON!
  }

  type Traffic {
    stationId: ID!
    snapshot: JSON!
  }

  input PreviewInput {
    stationId: ID!
    recordId: ID!
    revision: Int!
    audience: String!
  }

  type RevisionPreview {
    id: ID!
    revision: Int!
    schemaVersion: Int!
    values: JSON!
    document: JSON!
    media: [PublicMedia!]!
  }
