[project]
name = "radiotools-sdk"
version = "0.3.0"
description = "RadioTools listener SDK for Python (generated REST client)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radiotools_sdk"]
