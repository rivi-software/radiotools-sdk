name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Small SDK generation/typecheck/test workload: 2 vCPU / 8 GB, x64.
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check publishable manifests
        run: bun run check:manifests

      - name: Generate SDK artifacts
        run: bun run generate

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Import packed packages from plain Node
        run: bun run check:packages
