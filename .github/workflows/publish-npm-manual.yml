name: Publish npm (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: npm publish --dry-run (no upload)
        type: boolean
        default: true
      access:
        description: npm access level
        type: choice
        options:
          - public
          - restricted
        default: public

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Prepare packages
    # Small SDK generation/build/check workload: 2 vCPU / 8 GB, x64.
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate SDK artifacts
        run: bun run generate

      - name: Build publishable packages
        run: bun run build

      - name: Verify
        run: bun run check:manifests && bun run check && bun test && bun run check:packages

      - name: Archive prepared packages
        run: tar --exclude=node_modules -czf "$RUNNER_TEMP/prepared-packages.tar.gz" packages

      - name: Upload prepared packages
        uses: actions/upload-artifact@v4
        with:
          name: prepared-packages
          path: ${{ runner.temp }}/prepared-packages.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    # Keep npm upload/provenance on GitHub; preparation runs on Depot.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download prepared packages
        uses: actions/download-artifact@v4
        with:
          name: prepared-packages
          path: ${{ runner.temp }}

      - name: Restore prepared packages
        run: tar -xzf "$RUNNER_TEMP/prepared-packages.tar.gz"

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_ACCESS: ${{ inputs.access }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/publish-npm-ordered.sh
