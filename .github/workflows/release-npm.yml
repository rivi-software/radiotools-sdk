name: Release npm

on:
  push:
    branches:
      - main

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  prepare:
    name: Prepare packages
    # Small SDK generation/build/check workload: 2 vCPU / 8 GB, x64.
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate SDK artifacts
        run: bun run generate

      - name: Build publishable packages
        run: bun run build

      - name: Verify
        run: bun run check:manifests && bun run check && bun test && bun run check:packages

      - name: Archive prepared packages
        run: tar --exclude=node_modules -czf "$RUNNER_TEMP/prepared-packages.tar.gz" packages

      - name: Upload prepared packages
        uses: actions/upload-artifact@v4
        with:
          name: prepared-packages
          path: ${{ runner.temp }}/prepared-packages.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Version or publish
    needs: prepare
    # npm trusted publishing requires GitHub-hosted runners.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download prepared packages
        uses: actions/download-artifact@v4
        with:
          name: prepared-packages
          path: ${{ runner.temp }}

      - name: Restore prepared packages
        run: tar -xzf "$RUNNER_TEMP/prepared-packages.tar.gz"

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bunx changeset publish
          title: "chore: version packages for npm"
          commit: "chore: version packages for npm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
